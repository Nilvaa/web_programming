<!DOCTYPE html>
<html lang="en">
<head>
	<meta charset="UTF-8">
	<meta name="viewport" content="width=device-width, initial-scale=1.0">
	<title>Document</title>
</head>
<style>
	body{
		background-color: antiquewhite;
	}
	img{
		width: 35%;
		height: 300px;
	}
	div{
		margin-left: 500px;
		margin-top: 100px;
	}
</style>
<body>
	<div>
		<img src="img1.jpeg" alt="" onmouseover="over()" id="im">
		<h3 id="h">Before hovering</h3>
	</div>
</body>
<script>
	function over() {
		document.getElementById("im").src = "img2.jpeg";
		document.getElementById("h").innerText = "After hovering";
	}
	
</script>
</html>
