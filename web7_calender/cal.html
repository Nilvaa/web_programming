<!DOCTYPE html>
<html lang="en">
<head>
  <style>
    #calendar-container {
      text-align: center;
      margin-top: 20px;
    }
    .calendar-title {
      font-size: 1.5em;
      margin-bottom: 10px;
      color: green
      ;
    }
    .calendar {
      display: inline-block;
      border-collapse: collapse;
      margin-top: 10px;
    }
    .calendar th, .calendar td {
      border: 1px solid #ddd;
      text-align: center;
      padding: 10px;
      width: 50px;
      height: 50px;
    }
    .calendar th {
      background-color: #f4f4f4;}
  </style>
</head>
<body>
  <h1>Calendar </h1>
  <div id="form-container">
    <input type="number" id="year" placeholder="Enter year">
    <input type="number" id="month" placeholder="Enter month (1-12)">
    <button onclick="generateCalendar()">Click Here</button>
  </div>
  <div id="calendar-container"></div>
  <script>
    function generateCalendar() {
      const year = parseInt(document.getElementById('year').value);
      const month = parseInt(document.getElementById('month').value);
      if (!year || month < 1 || month > 12) {
        alert('Please enter a valid year and month.');
        return;
      }
      const calendarContainer = document.getElementById('calendar-container');
      calendarContainer.innerHTML = ""; 
      const monthNames = ["January", "February", "March", "April", "May", "June",
        "July", "August", "September", "October", "November", "December"];
      const title = document.createElement('div');
      title.classList.add('calendar-title');
      title.textContent = `${monthNames[month - 1]} ${year}`;
      calendarContainer.appendChild(title);
      const calendarTable = document.createElement('table');
      calendarTable.classList.add('calendar');
      const daysOfWeek = ['Sun', 'Mon', 'Tue', 'Wed', 'Thu', 'Fri', 'Sat'];
      const headerRow = document.createElement('tr');
      for (const day of daysOfWeek) {
        const th = document.createElement('th');
        th.textContent = day;
        headerRow.appendChild(th); }
      calendarTable.appendChild(headerRow);
      const firstDay = new Date(year, month - 1, 1).getDay();
      const daysInMonth = new Date(year, month, 0).getDate();
      let date = 1;
      for (let i = 0; i < 6; i++) { 
        const row = document.createElement('tr');
        for (let j = 0; j < 7; j++) { 
          const cell = document.createElement('td');
          if (i === 0 && j < firstDay) {
            cell.textContent = ''; 
          } else if (date > daysInMonth) {
            cell.textContent = ''; 
          } else {
            cell.textContent = date;
            date++;}
          row.appendChild(cell);}
        calendarTable.appendChild(row);}
        calendarContainer.appendChild(calendarTable);}
  </script>
</body>
</html>
